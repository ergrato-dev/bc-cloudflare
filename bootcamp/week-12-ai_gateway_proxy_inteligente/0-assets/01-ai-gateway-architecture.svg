<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" font-family="Inter, system-ui, sans-serif">
  <!-- Fondo -->
  <rect width="900" height="500" fill="#1a1a2e"/>

  <!-- Título -->
  <text x="450" y="36" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">AI Gateway — Proxy Inteligente entre Workers y Proveedores AI</text>

  <!-- ===== CLIENTE ===== -->
  <rect x="20" y="195" width="110" height="50" rx="8" fill="#16213e" stroke="#2D3748" stroke-width="1.5"/>
  <text x="75" y="216" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">Cliente</text>
  <text x="75" y="233" text-anchor="middle" font-size="10" fill="#A0AEC0">POST /chat</text>

  <!-- Flecha cliente → Worker -->
  <line x1="130" y1="220" x2="188" y2="220" stroke="#F38020" stroke-width="2" marker-end="url(#arr-o)"/>
  <text x="159" y="213" text-anchor="middle" font-size="9" fill="#F38020">HTTPS</text>

  <!-- ===== WORKER ===== -->
  <rect x="190" y="170" width="160" height="100" rx="8" fill="#F38020" fill-opacity="0.15" stroke="#F38020" stroke-width="2"/>
  <text x="270" y="193" text-anchor="middle" font-size="12" font-weight="bold" fill="#F38020">Cloudflare Worker</text>
  <text x="270" y="210" text-anchor="middle" font-size="10" fill="#FFFFFF">Hono + Zod</text>
  <rect x="204" y="218" width="132" height="18" rx="3" fill="#16213e" stroke="#2D3748"/>
  <text x="270" y="231" text-anchor="middle" font-size="9" fill="#A0AEC0">AI.run(..., { gateway })</text>
  <rect x="204" y="240" width="132" height="18" rx="3" fill="#16213e" stroke="#2D3748"/>
  <text x="270" y="253" text-anchor="middle" font-size="9" fill="#A0AEC0">fetch(GATEWAY_URL)</text>

  <!-- Flecha Worker → AI Gateway -->
  <line x1="350" y1="220" x2="418" y2="220" stroke="#F38020" stroke-width="2" marker-end="url(#arr-o)"/>
  <text x="384" y="213" text-anchor="middle" font-size="9" fill="#F38020">request</text>

  <!-- ===== AI GATEWAY ===== -->
  <rect x="420" y="120" width="200" height="300" rx="10" fill="#16213e" stroke="#F38020" stroke-width="2.5"/>
  <text x="520" y="148" text-anchor="middle" font-size="13" font-weight="bold" fill="#F38020">AI Gateway</text>

  <!-- Features dentro del gateway -->
  <rect x="436" y="158" width="168" height="22" rx="4" fill="#1a1a2e" stroke="#2D3748"/>
  <text x="520" y="173" text-anchor="middle" font-size="10" fill="#FFFFFF">📋 Logs &amp; Analytics</text>

  <rect x="436" y="185" width="168" height="22" rx="4" fill="#1a1a2e" stroke="#2D3748"/>
  <text x="520" y="200" text-anchor="middle" font-size="10" fill="#FFFFFF">⚡ Caché (TTL configurable)</text>

  <rect x="436" y="212" width="168" height="22" rx="4" fill="#1a1a2e" stroke="#2D3748"/>
  <text x="520" y="227" text-anchor="middle" font-size="10" fill="#FFFFFF">🚦 Rate Limiting</text>

  <rect x="436" y="239" width="168" height="22" rx="4" fill="#1a1a2e" stroke="#2D3748"/>
  <text x="520" y="254" text-anchor="middle" font-size="10" fill="#FFFFFF">🔄 Fallback automático</text>

  <!-- Separador -->
  <line x1="436" y1="276" x2="604" y2="276" stroke="#2D3748" stroke-width="1"/>
  <text x="520" y="292" text-anchor="middle" font-size="10" fill="#A0AEC0">Enruta al proveedor</text>
  <text x="520" y="306" text-anchor="middle" font-size="10" fill="#A0AEC0">correspondiente</text>

  <!-- Cache HIT badge -->
  <rect x="436" y="320" width="80" height="20" rx="10" fill="#003682"/>
  <text x="476" y="334" text-anchor="middle" font-size="9" fill="#FFFFFF">CACHE HIT</text>
  <rect x="524" y="320" width="80" height="20" rx="10" fill="#F38020" fill-opacity="0.3" stroke="#F38020" stroke-width="1"/>
  <text x="564" y="334" text-anchor="middle" font-size="9" fill="#F38020">CACHE MISS</text>

  <!-- Flecha Gateway → Workers AI -->
  <line x1="620" y1="185" x2="688" y2="160" stroke="#F38020" stroke-width="1.5" marker-end="url(#arr-o)"/>

  <!-- Flecha Gateway → OpenAI -->
  <line x1="620" y1="220" x2="688" y2="220" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-w)"/>

  <!-- Flecha Gateway → Anthropic -->
  <line x1="620" y1="260" x2="688" y2="290" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-w)"/>

  <!-- ===== WORKERS AI ===== -->
  <rect x="690" y="110" width="150" height="68" rx="8" fill="#F38020" fill-opacity="0.15" stroke="#F38020" stroke-width="1.5"/>
  <text x="765" y="133" text-anchor="middle" font-size="12" font-weight="bold" fill="#F38020">Workers AI</text>
  <text x="765" y="151" text-anchor="middle" font-size="10" fill="#FFFFFF">llama-3.1-8b-instruct</text>
  <text x="765" y="167" text-anchor="middle" font-size="10" fill="#A0AEC0">bge-base-en-v1.5</text>

  <!-- ===== OPENAI ===== -->
  <rect x="690" y="195" width="150" height="50" rx="8" fill="#003682" fill-opacity="0.3" stroke="#003682" stroke-width="1.5"/>
  <text x="765" y="218" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">OpenAI</text>
  <text x="765" y="234" text-anchor="middle" font-size="10" fill="#A0AEC0">gpt-4o-mini</text>

  <!-- ===== ANTHROPIC ===== -->
  <rect x="690" y="260" width="150" height="50" rx="8" fill="#003682" fill-opacity="0.3" stroke="#003682" stroke-width="1.5"/>
  <text x="765" y="283" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">Anthropic</text>
  <text x="765" y="299" text-anchor="middle" font-size="10" fill="#A0AEC0">claude-3-haiku</text>

  <!-- Flecha respuesta Gateway → Worker -->
  <line x1="418" y1="235" x2="352" y2="235" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-w)"/>
  <text x="384" y="248" text-anchor="middle" font-size="9" fill="#A0AEC0">response</text>
  <text x="384" y="259" text-anchor="middle" font-size="8" fill="#A0AEC0">cf-aig-cache-status</text>

  <!-- ===== DASHBOARD ANALYTICS ===== -->
  <rect x="420" y="435" width="200" height="46" rx="6" fill="#16213e" stroke="#2D3748" stroke-width="1"/>
  <text x="520" y="454" text-anchor="middle" font-size="10" font-weight="bold" fill="#FFFFFF">Dashboard AI Gateway</text>
  <text x="520" y="470" text-anchor="middle" font-size="9" fill="#A0AEC0">Logs · Analytics · Rate Limits · Cost</text>
  <!-- Flecha gateway → dashboard -->
  <line x1="520" y1="420" x2="520" y2="435" stroke="#2D3748" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-gray)"/>

  <!-- ===== LEYENDA ===== -->
  <rect x="20" y="380" width="380" height="100" rx="6" fill="#16213e" stroke="#2D3748" stroke-width="1"/>
  <text x="210" y="399" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF">Leyenda</text>
  <line x1="40" y1="415" x2="80" y2="415" stroke="#F38020" stroke-width="2"/>
  <text x="90" y="419" font-size="10" fill="#A0AEC0">Workers AI (binding nativo)</text>
  <line x1="40" y1="435" x2="80" y2="435" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="90" y="439" font-size="10" fill="#A0AEC0">Proveedor externo (fetch URL)</text>
  <rect x="40" y="450" width="14" height="14" rx="3" fill="#F38020" fill-opacity="0.5" stroke="#F38020"/>
  <text x="62" y="461" font-size="10" fill="#A0AEC0">Worker / Gateway (compute)</text>
  <rect x="200" y="450" width="14" height="14" rx="3" fill="#003682" fill-opacity="0.5" stroke="#003682"/>
  <text x="222" y="461" font-size="10" fill="#A0AEC0">Proveedor AI externo</text>

  <!-- Definiciones de marcadores -->
  <defs>
    <marker id="arr-o" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#F38020"/>
    </marker>
    <marker id="arr-w" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#FFFFFF"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#2D3748"/>
    </marker>
  </defs>
</svg>
