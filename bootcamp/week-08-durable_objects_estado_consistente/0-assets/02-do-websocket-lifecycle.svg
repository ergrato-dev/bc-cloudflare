<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460">
  <defs>
    <marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#6b7280"/>
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#F38020"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#34d399"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#60a5fa"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="460" fill="#1a1a2e"/>

  <!-- Title -->
  <text x="480" y="34" fill="#ffffff" font-family="Inter, Roboto, sans-serif" font-size="17" font-weight="600" text-anchor="middle">WebSockets en Durable Objects — Hibernation API</text>

  <!-- Cloudflare Edge boundary -->
  <rect x="195" y="55" width="735" height="360" rx="10" fill="#16213e" stroke="#F38020" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.9"/>
  <text x="562" y="74" fill="#F38020" font-family="Inter, Roboto, sans-serif" font-size="11" font-weight="500" text-anchor="middle" opacity="0.8">Cloudflare Edge</text>

  <!-- ── Clients ── -->
  <!-- Client A -->
  <rect x="18" y="108" width="122" height="52" rx="8" fill="#252540" stroke="#6b7280" stroke-width="1.5"/>
  <text x="79" y="131" fill="#e5e7eb" font-family="Inter, Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Cliente A</text>
  <text x="79" y="149" fill="#9ca3af" font-family="Inter, Roboto, sans-serif" font-size="10" text-anchor="middle">Browser / App</text>

  <!-- Client B -->
  <rect x="18" y="200" width="122" height="52" rx="8" fill="#252540" stroke="#6b7280" stroke-width="1.5"/>
  <text x="79" y="223" fill="#e5e7eb" font-family="Inter, Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Cliente B</text>
  <text x="79" y="241" fill="#9ca3af" font-family="Inter, Roboto, sans-serif" font-size="10" text-anchor="middle">Browser / App</text>

  <!-- Client C -->
  <rect x="18" y="292" width="122" height="52" rx="8" fill="#252540" stroke="#6b7280" stroke-width="1.5"/>
  <text x="79" y="315" fill="#e5e7eb" font-family="Inter, Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Cliente C</text>
  <text x="79" y="333" fill="#9ca3af" font-family="Inter, Roboto, sans-serif" font-size="10" text-anchor="middle">Browser / App</text>

  <!-- ── Worker (routing stub) ── -->
  <rect x="222" y="105" width="175" height="240" rx="8" fill="#1a1a2e" stroke="#F38020" stroke-width="2"/>
  <text x="309" y="133" fill="#F38020" font-family="Inter, Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Worker</text>
  <text x="309" y="151" fill="#9ca3af" font-family="Inter, Roboto, sans-serif" font-size="10" text-anchor="middle">routing stub</text>

  <!-- Step 1: HTTP Upgrade -->
  <rect x="235" y="162" width="149" height="34" rx="5" fill="#252540" stroke="#6b7280" stroke-width="1"/>
  <text x="309" y="177" fill="#fbbf24" font-family="Inter, Roboto, sans-serif" font-size="10" font-weight="500" text-anchor="middle">1. GET / Upgrade: websocket</text>
  <text x="309" y="191" fill="#6b7280" font-family="Inter, Roboto, sans-serif" font-size="9" text-anchor="middle">request.headers.get("Upgrade")</text>

  <!-- Step 2: Get DO stub -->
  <rect x="235" y="204" width="149" height="34" rx="5" fill="#252540" stroke="#6b7280" stroke-width="1"/>
  <text x="309" y="219" fill="#fbbf24" font-family="Inter, Roboto, sans-serif" font-size="10" font-weight="500" text-anchor="middle">2. env.CHAT.idFromName()</text>
  <text x="309" y="233" fill="#6b7280" font-family="Inter, Roboto, sans-serif" font-size="9" text-anchor="middle">Obtiene el stub del DO</text>

  <!-- Step 3: Forward to DO -->
  <rect x="235" y="246" width="149" height="34" rx="5" fill="#252540" stroke="#6b7280" stroke-width="1"/>
  <text x="309" y="261" fill="#fbbf24" font-family="Inter, Roboto, sans-serif" font-size="10" font-weight="500" text-anchor="middle">3. stub.fetch(request)</text>
  <text x="309" y="275" fill="#6b7280" font-family="Inter, Roboto, sans-serif" font-size="9" text-anchor="middle">Delega al DO</text>

  <!-- ── Durable Object ── -->
  <rect x="450" y="78" width="455" height="318" rx="8" fill="#1a1a2e" stroke="#F38020" stroke-width="2"/>
  <text x="672" y="106" fill="#F38020" font-family="Inter, Roboto, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Durable Object — ChatRoom</text>
  <text x="672" y="124" fill="#9ca3af" font-family="Inter, Roboto, sans-serif" font-size="11" text-anchor="middle">Instancia única · estado compartido</text>

  <!-- WebSocketPair box -->
  <rect x="464" y="136" width="190" height="88" rx="6" fill="#252540" stroke="#F38020" stroke-width="1"/>
  <text x="559" y="155" fill="#F38020" font-family="Inter, Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">acceptWebSocket(server)</text>
  <text x="559" y="173" fill="#9ca3af" font-family="Inter, Roboto, sans-serif" font-size="10" text-anchor="middle">WebSocketPair</text>
  <text x="559" y="188" fill="#6b7280" font-family="Inter, Roboto, sans-serif" font-size="9" text-anchor="middle">[client] ←→ [server]</text>
  <text x="559" y="204" fill="#34d399" font-family="Inter, Roboto, sans-serif" font-size="9" font-weight="500" text-anchor="middle">Hibernation: DO duerme entre mensajes</text>

  <!-- Handlers box -->
  <rect x="464" y="234" width="190" height="100" rx="6" fill="#252540" stroke="#6b7280" stroke-width="1"/>
  <text x="559" y="252" fill="#d1d5db" font-family="Inter, Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Handlers</text>
  <text x="559" y="270" fill="#9ca3af" font-family="Inter, Roboto, sans-serif" font-size="10" text-anchor="middle">webSocketMessage(ws, msg)</text>
  <text x="559" y="286" fill="#6b7280" font-family="Inter, Roboto, sans-serif" font-size="9" text-anchor="middle">→ broadcast a todos los clientes</text>
  <text x="559" y="304" fill="#9ca3af" font-family="Inter, Roboto, sans-serif" font-size="10" text-anchor="middle">webSocketClose(ws)</text>
  <text x="559" y="320" fill="#6b7280" font-family="Inter, Roboto, sans-serif" font-size="9" text-anchor="middle">→ limpiar conexión</text>

  <!-- Persistent Storage inside DO -->
  <rect x="668" y="136" width="218" height="198" rx="6" fill="#16213e" stroke="#003682" stroke-width="1.5"/>
  <text x="777" y="155" fill="#60a5fa" font-family="Inter, Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Persistent Storage</text>
  <text x="777" y="173" fill="#9ca3af" font-family="Inter, Roboto, sans-serif" font-size="10" text-anchor="middle">this.state.storage</text>

  <rect x="680" y="181" width="194" height="22" rx="4" fill="#252540"/>
  <text x="777" y="196" fill="#fbbf24" font-family="Inter, Roboto, sans-serif" font-size="10" text-anchor="middle">"messages" → [msg1, msg2…]</text>

  <rect x="680" y="210" width="194" height="22" rx="4" fill="#252540"/>
  <text x="777" y="225" fill="#fbbf24" font-family="Inter, Roboto, sans-serif" font-size="10" text-anchor="middle">"users_online" → 3</text>

  <rect x="680" y="239" width="194" height="22" rx="4" fill="#252540"/>
  <text x="777" y="254" fill="#fbbf24" font-family="Inter, Roboto, sans-serif" font-size="10" text-anchor="middle">"created_at" → timestamp</text>

  <text x="777" y="285" fill="#6b7280" font-family="Inter, Roboto, sans-serif" font-size="9" text-anchor="middle">Sobrevive a reinicios del DO</text>
  <text x="777" y="300" fill="#6b7280" font-family="Inter, Roboto, sans-serif" font-size="9" text-anchor="middle">Mismo estado para todos los clientes</text>
  <text x="777" y="316" fill="#34d399" font-family="Inter, Roboto, sans-serif" font-size="9" font-weight="500" text-anchor="middle">Acceso sincrono a la storage (await)</text>

  <!-- ── Arrows: Clients → Worker ── -->
  <!-- Client A → Worker -->
  <line x1="140" y1="134" x2="220" y2="210" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
  <!-- Client B → Worker -->
  <line x1="140" y1="226" x2="220" y2="226" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
  <!-- Client C → Worker -->
  <line x1="140" y1="318" x2="220" y2="242" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
  <text x="163" y="220" fill="#9ca3af" font-family="Inter, Roboto, sans-serif" font-size="9" text-anchor="middle">WS upgrade</text>

  <!-- Worker → DO -->
  <line x1="397" y1="226" x2="448" y2="226" stroke="#F38020" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <text x="423" y="218" fill="#F38020" font-family="Inter, Roboto, sans-serif" font-size="9" text-anchor="middle">stub.fetch()</text>

  <!-- DO WebSocket handlers → Storage -->
  <line x1="654" y1="226" x2="666" y2="226" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- Broadcast arrows from DO back to clients (dashed green) -->
  <line x1="448" y1="270" x2="397" y2="240" stroke="#34d399" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow-green)"/>
  <text x="418" y="265" fill="#34d399" font-family="Inter, Roboto, sans-serif" font-size="9" text-anchor="middle">broadcast</text>
  <line x1="220" y1="240" x2="140" y2="226" stroke="#34d399" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow-green)"/>
  <line x1="220" y1="234" x2="140" y2="144" stroke="#34d399" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow-green)"/>
  <line x1="220" y1="246" x2="140" y2="318" stroke="#34d399" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow-green)"/>

  <!-- Legend -->
  <rect x="222" y="370" width="660" height="36" rx="6" fill="#252540" stroke="#374151" stroke-width="1"/>
  <circle cx="245" cy="388" r="4" fill="#34d399"/>
  <text x="255" y="392" fill="#9ca3af" font-family="Inter, Roboto, sans-serif" font-size="10">Hibernation: DO duerme entre mensajes → coste cero</text>
  <circle cx="500" cy="388" r="4" fill="#F38020"/>
  <text x="510" y="392" fill="#9ca3af" font-family="Inter, Roboto, sans-serif" font-size="10">Una sola instancia DO por sala · estado compartido entre clientes</text>
</svg>
