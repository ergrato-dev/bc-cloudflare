<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 0 920 380">
  <defs>
    <marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#F38020"/>
    </marker>
    <marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#6b7280"/>
    </marker>
    <marker id="arrow-yellow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#fbbf24"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="920" height="380" fill="#1a1a2e"/>

  <!-- Title -->
  <text x="460" y="34" fill="#ffffff" font-family="Inter, Roboto, sans-serif" font-size="17" font-weight="600" text-anchor="middle">Alarms — Tareas Programadas en Durable Objects</text>

  <!-- Timeline baseline -->
  <line x1="40" y1="190" x2="880" y2="190" stroke="#374151" stroke-width="2"/>

  <!-- ── Step 1: HTTP Request arrives ── -->
  <rect x="40" y="100" width="160" height="72" rx="8" fill="#252540" stroke="#F38020" stroke-width="2"/>
  <text x="120" y="124" fill="#F38020" font-family="Inter, Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">1. Request</text>
  <text x="120" y="142" fill="#d1d5db" font-family="Inter, Roboto, sans-serif" font-size="10" text-anchor="middle">GET /start-window</text>
  <text x="120" y="158" fill="#9ca3af" font-family="Inter, Roboto, sans-serif" font-size="10" text-anchor="middle">→ fetch() del DO</text>
  <!-- connector dot -->
  <circle cx="120" cy="190" r="6" fill="#F38020"/>
  <!-- vertical connector -->
  <line x1="120" y1="172" x2="120" y2="190" stroke="#F38020" stroke-width="1.5"/>

  <!-- ── Step 2: setAlarm called ── -->
  <rect x="240" y="100" width="175" height="72" rx="8" fill="#252540" stroke="#F38020" stroke-width="2"/>
  <text x="327" y="120" fill="#F38020" font-family="Inter, Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">2. setAlarm()</text>
  <text x="327" y="138" fill="#d1d5db" font-family="Inter, Roboto, sans-serif" font-size="10" text-anchor="middle">storage.setAlarm(</text>
  <text x="327" y="153" fill="#fbbf24" font-family="Inter, Roboto, sans-serif" font-size="10" text-anchor="middle">  Date.now() + 60_000</text>
  <text x="327" y="168" fill="#d1d5db" font-family="Inter, Roboto, sans-serif" font-size="10" text-anchor="middle">)</text>
  <circle cx="327" cy="190" r="6" fill="#F38020"/>
  <line x1="327" y1="172" x2="327" y2="190" stroke="#F38020" stroke-width="1.5"/>

  <!-- Arrow step 1 → step 2 -->
  <line x1="200" y1="190" x2="240" y2="190" stroke="#F38020" stroke-width="2" marker-end="url(#arrow-orange)"/>

  <!-- ── Waiting period (dashed) ── -->
  <line x1="415" y1="190" x2="565" y2="190" stroke="#374151" stroke-width="2" stroke-dasharray="10 6"/>
  <!-- Time label above dashed -->
  <rect x="435" y="155" width="110" height="28" rx="6" fill="#16213e" stroke="#374151" stroke-width="1"/>
  <text x="490" y="174" fill="#9ca3af" font-family="Inter, Roboto, sans-serif" font-size="11" text-anchor="middle">⏳ ~60 segundos</text>
  <!-- Dots on dashed line -->
  <circle cx="450" cy="190" r="3" fill="#374151"/>
  <circle cx="490" cy="190" r="3" fill="#374151"/>
  <circle cx="530" cy="190" r="3" fill="#374151"/>

  <!-- Arrow step 2 → waiting -->
  <line x1="415" y1="190" x2="415" y2="190" stroke="#F38020" stroke-width="2"/>

  <!-- DO Sleeping indicator -->
  <rect x="415" y="210" width="150" height="40" rx="6" fill="#16213e" stroke="#374151" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="490" y="229" fill="#6b7280" font-family="Inter, Roboto, sans-serif" font-size="11" text-anchor="middle">DO inactivo</text>
  <text x="490" y="244" fill="#6b7280" font-family="Inter, Roboto, sans-serif" font-size="10" text-anchor="middle">no consume recursos</text>

  <!-- ── Step 3: Alarm fires ── -->
  <rect x="575" y="100" width="175" height="72" rx="8" fill="#252540" stroke="#fbbf24" stroke-width="2"/>
  <text x="662" y="120" fill="#fbbf24" font-family="Inter, Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">3. alarm() dispara</text>
  <text x="662" y="138" fill="#d1d5db" font-family="Inter, Roboto, sans-serif" font-size="10" text-anchor="middle">Cloudflare invoca</text>
  <text x="662" y="153" fill="#9ca3af" font-family="Inter, Roboto, sans-serif" font-size="10" text-anchor="middle">alarm(): Promise&lt;void&gt;</text>
  <text x="662" y="168" fill="#9ca3af" font-family="Inter, Roboto, sans-serif" font-size="10" text-anchor="middle">automáticamente</text>
  <circle cx="662" cy="190" r="6" fill="#fbbf24"/>
  <line x1="662" y1="172" x2="662" y2="190" stroke="#fbbf24" stroke-width="1.5"/>

  <!-- Arrow waiting → alarm fires -->
  <line x1="565" y1="190" x2="573" y2="190" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow-yellow)"/>

  <!-- ── Step 4: Action / Reset ── -->
  <rect x="760" y="100" width="148" height="72" rx="8" fill="#252540" stroke="#34d399" stroke-width="2"/>
  <text x="834" y="120" fill="#34d399" font-family="Inter, Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">4. Acción</text>
  <text x="834" y="138" fill="#d1d5db" font-family="Inter, Roboto, sans-serif" font-size="10" text-anchor="middle">storage.put(</text>
  <text x="834" y="153" fill="#fbbf24" font-family="Inter, Roboto, sans-serif" font-size="10" text-anchor="middle">  "hits", 0</text>
  <text x="834" y="168" fill="#d1d5db" font-family="Inter, Roboto, sans-serif" font-size="10" text-anchor="middle">)  // reset</text>
  <circle cx="834" cy="190" r="6" fill="#34d399"/>
  <line x1="834" y1="172" x2="834" y2="190" stroke="#34d399" stroke-width="1.5"/>

  <!-- Arrow alarm → action -->
  <line x1="750" y1="190" x2="758" y2="190" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-gray)"/>

  <!-- ── Use cases ── -->
  <rect x="40" y="248" width="840" height="90" rx="8" fill="#16213e" stroke="#374151" stroke-width="1"/>
  <text x="460" y="270" fill="#9ca3af" font-family="Inter, Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Casos de uso comunes</text>

  <!-- Use case chips -->
  <rect x="58" y="282" width="180" height="26" rx="6" fill="#252540" stroke="#F38020" stroke-width="1"/>
  <text x="148" y="300" fill="#d1d5db" font-family="Inter, Roboto, sans-serif" font-size="10" text-anchor="middle">⏱ Reset de ventana temporal</text>

  <rect x="252" y="282" width="160" height="26" rx="6" fill="#252540" stroke="#F38020" stroke-width="1"/>
  <text x="332" y="300" fill="#d1d5db" font-family="Inter, Roboto, sans-serif" font-size="10" text-anchor="middle">🔒 Expiración de sesión</text>

  <rect x="426" y="282" width="175" height="26" rx="6" fill="#252540" stroke="#F38020" stroke-width="1"/>
  <text x="513" y="300" fill="#d1d5db" font-family="Inter, Roboto, sans-serif" font-size="10" text-anchor="middle">📦 Flush de batch diferido</text>

  <rect x="615" y="282" width="180" height="26" rx="6" fill="#252540" stroke="#F38020" stroke-width="1"/>
  <text x="705" y="300" fill="#d1d5db" font-family="Inter, Roboto, sans-serif" font-size="10" text-anchor="middle">🧹 Limpieza de estado viejo</text>

  <text x="460" y="328" fill="#6b7280" font-family="Inter, Roboto, sans-serif" font-size="10" text-anchor="middle">Solo una alarma activa por DO · setAlarm() sobreescribe la anterior · garantía at-least-once</text>
</svg>
