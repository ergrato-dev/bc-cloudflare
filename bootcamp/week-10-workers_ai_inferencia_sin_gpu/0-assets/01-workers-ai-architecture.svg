<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480">
  <defs>
    <marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#6b7280"/>
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#F38020"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#60a5fa"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="480" fill="#1a1a2e"/>

  <!-- Title -->
  <text x="480" y="36" fill="#ffffff" font-family="Inter, Roboto, sans-serif" font-size="18" font-weight="600" text-anchor="middle">Workers AI — Inferencia sin GPU propia</text>

  <!-- Cloudflare Edge Zone boundary -->
  <rect x="170" y="58" width="750" height="380" rx="10" fill="#16213e" stroke="#F38020" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.9"/>
  <text x="545" y="78" fill="#F38020" font-family="Inter, Roboto, sans-serif" font-size="11" font-weight="500" text-anchor="middle" opacity="0.8">Cloudflare Edge (GPU PoP)</text>

  <!-- Client box -->
  <rect x="18" y="195" width="120" height="70" rx="8" fill="#252540" stroke="#6b7280" stroke-width="1.5"/>
  <text x="78" y="227" fill="#e5e7eb" font-family="Inter, Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Cliente</text>
  <text x="78" y="246" fill="#9ca3af" font-family="Inter, Roboto, sans-serif" font-size="11" text-anchor="middle">Browser / App</text>

  <!-- Worker box -->
  <rect x="200" y="155" width="185" height="150" rx="8" fill="#1a1a2e" stroke="#F38020" stroke-width="2"/>
  <text x="292" y="185" fill="#F38020" font-family="Inter, Roboto, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Worker</text>
  <text x="292" y="205" fill="#d1d5db" font-family="Inter, Roboto, sans-serif" font-size="11" text-anchor="middle">Hono + TypeScript</text>
  <text x="292" y="223" fill="#6b7280" font-family="Inter, Roboto, sans-serif" font-size="10" text-anchor="middle">c.env.AI.run(model, inputs)</text>
  <rect x="218" y="232" width="149" height="24" rx="5" fill="#252540" stroke="#F38020" stroke-width="1" opacity="0.8"/>
  <text x="292" y="248" fill="#fbbf24" font-family="Inter, Roboto, sans-serif" font-size="10" font-weight="500" text-anchor="middle">binding: AI: Ai</text>
  <text x="292" y="274" fill="#6b7280" font-family="Inter, Roboto, sans-serif" font-size="10" text-anchor="middle">wrangler.jsonc → "ai"</text>
  <text x="292" y="292" fill="#6b7280" font-family="Inter, Roboto, sans-serif" font-size="10" text-anchor="middle">{ "binding": "AI" }</text>

  <!-- Workers AI Runtime box -->
  <rect x="440" y="100" width="185" height="258" rx="8" fill="#1a1a2e" stroke="#F38020" stroke-width="2"/>
  <text x="532" y="128" fill="#F38020" font-family="Inter, Roboto, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Workers AI</text>
  <text x="532" y="147" fill="#d1d5db" font-family="Inter, Roboto, sans-serif" font-size="11" text-anchor="middle">Runtime de Inferencia</text>

  <!-- Model type rows inside Workers AI -->
  <!-- LLM -->
  <rect x="456" y="158" width="153" height="38" rx="5" fill="#003682" stroke="#60a5fa" stroke-width="1"/>
  <text x="532" y="174" fill="#93c5fd" font-family="Inter, Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">text-generation</text>
  <text x="532" y="189" fill="#6b7280" font-family="Inter, Roboto, sans-serif" font-size="9" text-anchor="middle">llama-3.1-8b-instruct</text>

  <!-- Embeddings -->
  <rect x="456" y="204" width="153" height="38" rx="5" fill="#003682" stroke="#60a5fa" stroke-width="1"/>
  <text x="532" y="220" fill="#93c5fd" font-family="Inter, Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">text-embeddings</text>
  <text x="532" y="235" fill="#6b7280" font-family="Inter, Roboto, sans-serif" font-size="9" text-anchor="middle">bge-base-en-v1.5 · 768 dims</text>

  <!-- Image -->
  <rect x="456" y="250" width="153" height="38" rx="5" fill="#003682" stroke="#60a5fa" stroke-width="1"/>
  <text x="532" y="266" fill="#93c5fd" font-family="Inter, Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">text-to-image</text>
  <text x="532" y="281" fill="#6b7280" font-family="Inter, Roboto, sans-serif" font-size="9" text-anchor="middle">stable-diffusion-xl-base-1.0</text>

  <!-- Speech -->
  <rect x="456" y="296" width="153" height="38" rx="5" fill="#003682" stroke="#60a5fa" stroke-width="1"/>
  <text x="532" y="312" fill="#93c5fd" font-family="Inter, Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">speech-recognition</text>
  <text x="532" y="327" fill="#6b7280" font-family="Inter, Roboto, sans-serif" font-size="9" text-anchor="middle">whisper · MP3 / WAV</text>

  <!-- GPU cluster box -->
  <rect x="700" y="130" width="185" height="200" rx="8" fill="#1a1a2e" stroke="#003682" stroke-width="2"/>
  <text x="792" y="158" fill="#60a5fa" font-family="Inter, Roboto, sans-serif" font-size="14" font-weight="700" text-anchor="middle">GPU Cluster</text>
  <text x="792" y="176" fill="#9ca3af" font-family="Inter, Roboto, sans-serif" font-size="11" text-anchor="middle">Cloudflare-managed</text>

  <!-- GPU chips -->
  <rect x="720" y="188" width="52" height="32" rx="4" fill="#252540" stroke="#4b5563" stroke-width="1"/>
  <text x="746" y="208" fill="#9ca3af" font-family="Inter, Roboto, sans-serif" font-size="10" text-anchor="middle">GPU</text>
  <rect x="780" y="188" width="52" height="32" rx="4" fill="#252540" stroke="#4b5563" stroke-width="1"/>
  <text x="806" y="208" fill="#9ca3af" font-family="Inter, Roboto, sans-serif" font-size="10" text-anchor="middle">GPU</text>
  <rect x="840" y="188" width="30" height="32" rx="4" fill="#252540" stroke="#4b5563" stroke-width="1"/>
  <text x="855" y="208" fill="#9ca3af" font-family="Inter, Roboto, sans-serif" font-size="10" text-anchor="middle">…</text>

  <rect x="720" y="230" width="52" height="32" rx="4" fill="#252540" stroke="#4b5563" stroke-width="1"/>
  <text x="746" y="250" fill="#9ca3af" font-family="Inter, Roboto, sans-serif" font-size="10" text-anchor="middle">GPU</text>
  <rect x="780" y="230" width="52" height="32" rx="4" fill="#252540" stroke="#4b5563" stroke-width="1"/>
  <text x="806" y="250" fill="#9ca3af" font-family="Inter, Roboto, sans-serif" font-size="10" text-anchor="middle">GPU</text>

  <text x="792" y="290" fill="#6b7280" font-family="Inter, Roboto, sans-serif" font-size="10" text-anchor="middle">Modelos cargados en VRAM</text>
  <text x="792" y="306" fill="#6b7280" font-family="Inter, Roboto, sans-serif" font-size="10" text-anchor="middle">Sin cold start para tí</text>

  <!-- Arrows -->
  <!-- Client -> Worker: HTTP Request -->
  <line x1="138" y1="230" x2="198" y2="230" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
  <text x="168" y="222" fill="#9ca3af" font-family="Inter, Roboto, sans-serif" font-size="10" text-anchor="middle">HTTP</text>

  <!-- Worker -> Workers AI: AI.run() -->
  <line x1="385" y1="230" x2="438" y2="230" stroke="#F38020" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <text x="412" y="222" fill="#F38020" font-family="Inter, Roboto, sans-serif" font-size="10" text-anchor="middle">AI.run()</text>

  <!-- Workers AI -> GPU -->
  <line x1="625" y1="230" x2="698" y2="230" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="661" y="222" fill="#60a5fa" font-family="Inter, Roboto, sans-serif" font-size="10" text-anchor="middle">inferencia</text>

  <!-- Return arrows (dashed) -->
  <!-- GPU -> Workers AI -->
  <line x1="698" y1="250" x2="625" y2="250" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-blue)"/>
  <text x="661" y="265" fill="#60a5fa" font-family="Inter, Roboto, sans-serif" font-size="10" text-anchor="middle">resultado</text>

  <!-- Workers AI -> Worker -->
  <line x1="438" y1="250" x2="385" y2="250" stroke="#F38020" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-orange)"/>

  <!-- Worker -> Client -->
  <line x1="198" y1="250" x2="138" y2="250" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-gray)"/>
  <text x="168" y="265" fill="#9ca3af" font-family="Inter, Roboto, sans-serif" font-size="10" text-anchor="middle">JSON/SSE</text>

  <!-- Legend -->
  <rect x="200" y="420" width="560" height="38" rx="6" fill="#252540" stroke="#374151" stroke-width="1"/>
  <text x="480" y="436" fill="#9ca3af" font-family="Inter, Roboto, sans-serif" font-size="10" text-anchor="middle">Sin provisión de GPU · Sin gestión de modelos · Paga solo por tokens inferidos</text>
  <text x="480" y="452" fill="#6b7280" font-family="Inter, Roboto, sans-serif" font-size="10" text-anchor="middle">Más de 50 modelos disponibles en developers.cloudflare.com/workers-ai/models</text>
</svg>
