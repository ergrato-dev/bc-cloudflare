<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420">
  <defs>
    <marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#6b7280"/>
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#F38020"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#34d399"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#60a5fa"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="420" fill="#1a1a2e"/>

  <!-- Title -->
  <text x="480" y="34" fill="#ffffff" font-family="Inter, Roboto, sans-serif" font-size="17" font-weight="600" text-anchor="middle">Streaming SSE — Tokens Progresivos con Workers AI</text>

  <!-- ── Client ── -->
  <rect x="22" y="100" width="148" height="150" rx="8" fill="#252540" stroke="#6b7280" stroke-width="1.5"/>
  <text x="96" y="123" fill="#e5e7eb" font-family="Inter, Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Cliente</text>
  <text x="96" y="141" fill="#9ca3af" font-family="Inter, Roboto, sans-serif" font-size="10" text-anchor="middle">Browser / App</text>
  <rect x="36" y="152" width="120" height="20" rx="4" fill="#16213e" stroke="#374151" stroke-width="1"/>
  <text x="96" y="166" fill="#fbbf24" font-family="Inter, Roboto, sans-serif" font-size="9" text-anchor="middle">fetch() + getReader()</text>
  <rect x="36" y="178" width="120" height="20" rx="4" fill="#16213e" stroke="#374151" stroke-width="1"/>
  <text x="96" y="192" fill="#fbbf24" font-family="Inter, Roboto, sans-serif" font-size="9" text-anchor="middle">o EventSource</text>
  <text x="96" y="220" fill="#9ca3af" font-family="Inter, Roboto, sans-serif" font-size="9" text-anchor="middle">Renderiza tokens</text>
  <text x="96" y="234" fill="#9ca3af" font-family="Inter, Roboto, sans-serif" font-size="9" text-anchor="middle">a medida que llegan</text>

  <!-- ── Worker ── -->
  <rect x="230" y="80" width="200" height="190" rx="8" fill="#1a1a2e" stroke="#F38020" stroke-width="2"/>
  <text x="330" y="106" fill="#F38020" font-family="Inter, Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Worker</text>
  <text x="330" y="124" fill="#9ca3af" font-family="Inter, Roboto, sans-serif" font-size="10" text-anchor="middle">POST /chat/stream</text>

  <rect x="244" y="135" width="172" height="50" rx="5" fill="#252540" stroke="#374151" stroke-width="1"/>
  <text x="330" y="153" fill="#fbbf24" font-family="Inter, Roboto, sans-serif" font-size="9" font-weight="500" text-anchor="middle">AI.run(model, {</text>
  <text x="330" y="167" fill="#fbbf24" font-family="Inter, Roboto, sans-serif" font-size="9" text-anchor="middle">  messages, stream: true</text>
  <text x="330" y="181" fill="#fbbf24" font-family="Inter, Roboto, sans-serif" font-size="9" text-anchor="middle">})</text>

  <rect x="244" y="194" width="172" height="50" rx="5" fill="#252540" stroke="#374151" stroke-width="1"/>
  <text x="330" y="212" fill="#d1d5db" font-family="Inter, Roboto, sans-serif" font-size="9" text-anchor="middle">new Response(stream, {</text>
  <text x="330" y="226" fill="#34d399" font-family="Inter, Roboto, sans-serif" font-size="9" text-anchor="middle">  "Content-Type":</text>
  <text x="330" y="240" fill="#34d399" font-family="Inter, Roboto, sans-serif" font-size="9" text-anchor="middle">  "text/event-stream"</text>

  <!-- ── Workers AI ── -->
  <rect x="498" y="80" width="200" height="190" rx="8" fill="#1a1a2e" stroke="#F38020" stroke-width="2"/>
  <text x="598" y="106" fill="#F38020" font-family="Inter, Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Workers AI</text>
  <text x="598" y="124" fill="#9ca3af" font-family="Inter, Roboto, sans-serif" font-size="10" text-anchor="middle">llama-3.1-8b-instruct</text>

  <rect x="512" y="135" width="172" height="112" rx="5" fill="#252540" stroke="#003682" stroke-width="1"/>
  <text x="598" y="153" fill="#60a5fa" font-family="Inter, Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">ReadableStream</text>
  <text x="598" y="170" fill="#9ca3af" font-family="Inter, Roboto, sans-serif" font-size="9" text-anchor="middle">Genera tokens uno a uno</text>
  <text x="598" y="186" fill="#9ca3af" font-family="Inter, Roboto, sans-serif" font-size="9" text-anchor="middle">GPU → buffer → stream</text>
  <line x1="520" y1="196" x2="676" y2="196" stroke="#374151" stroke-width="1"/>
  <text x="598" y="210" fill="#6b7280" font-family="Inter, Roboto, sans-serif" font-size="9" text-anchor="middle">chunk: {"response":"Hola"}</text>
  <text x="598" y="225" fill="#6b7280" font-family="Inter, Roboto, sans-serif" font-size="9" text-anchor="middle">chunk: {"response":" mundo"}</text>
  <text x="598" y="240" fill="#6b7280" font-family="Inter, Roboto, sans-serif" font-size="9" text-anchor="middle">chunk: [DONE]</text>

  <!-- ── SSE Events timeline ── -->
  <rect x="770" y="80" width="170" height="190" rx="8" fill="#16213e" stroke="#34d399" stroke-width="1.5"/>
  <text x="855" y="104" fill="#34d399" font-family="Inter, Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Eventos SSE</text>
  <text x="855" y="120" fill="#6b7280" font-family="Inter, Roboto, sans-serif" font-size="9" text-anchor="middle">text/event-stream</text>

  <rect x="782" y="128" width="146" height="18" rx="3" fill="#252540"/>
  <text x="855" y="141" fill="#34d399" font-family="Inter, Roboto, sans-serif" font-size="9" text-anchor="middle">data: {"response":"Hola"}</text>

  <rect x="782" y="152" width="146" height="18" rx="3" fill="#252540"/>
  <text x="855" y="165" fill="#34d399" font-family="Inter, Roboto, sans-serif" font-size="9" text-anchor="middle">data: {"response":" mundo"}</text>

  <rect x="782" y="176" width="146" height="18" rx="3" fill="#252540"/>
  <text x="855" y="189" fill="#34d399" font-family="Inter, Roboto, sans-serif" font-size="9" text-anchor="middle">data: {"response":"."}</text>

  <rect x="782" y="200" width="146" height="18" rx="3" fill="#252540" stroke="#fbbf24" stroke-width="0.5"/>
  <text x="855" y="213" fill="#fbbf24" font-family="Inter, Roboto, sans-serif" font-size="9" text-anchor="middle">data: [DONE]</text>

  <text x="855" y="248" fill="#6b7280" font-family="Inter, Roboto, sans-serif" font-size="9" text-anchor="middle">Cada línea termina en \n\n</text>

  <!-- ── Arrows ── -->
  <!-- Client → Worker: POST request -->
  <line x1="170" y1="155" x2="228" y2="155" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
  <text x="199" y="147" fill="#9ca3af" font-family="Inter, Roboto, sans-serif" font-size="9" text-anchor="middle">POST</text>

  <!-- Worker → Workers AI -->
  <line x1="430" y1="175" x2="496" y2="175" stroke="#F38020" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <text x="463" y="167" fill="#F38020" font-family="Inter, Roboto, sans-serif" font-size="9" text-anchor="middle">AI.run()</text>

  <!-- Workers AI → SSE Events -->
  <line x1="698" y1="175" x2="768" y2="175" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="733" y="167" fill="#60a5fa" font-family="Inter, Roboto, sans-serif" font-size="9" text-anchor="middle">stream</text>

  <!-- SSE Events → Client (dashed green, back arrow) -->
  <line x1="768" y1="200" x2="430" y2="200" stroke="#34d399" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow-green)"/>
  <line x1="228" y1="200" x2="170" y2="200" stroke="#34d399" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow-green)"/>
  <text x="599" y="218" fill="#34d399" font-family="Inter, Roboto, sans-serif" font-size="9" text-anchor="middle">tokens progresivos →</text>

  <!-- ── Comparison box ── -->
  <rect x="22" y="300" width="916" height="90" rx="8" fill="#16213e" stroke="#374151" stroke-width="1"/>
  <text x="480" y="322" fill="#9ca3af" font-family="Inter, Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Respuesta completa vs. Streaming</text>

  <!-- Complete response -->
  <rect x="38" y="334" width="420" height="44" rx="6" fill="#252540" stroke="#6b7280" stroke-width="1"/>
  <text x="248" y="352" fill="#9ca3af" font-family="Inter, Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">stream: false (default) — Respuesta completa</text>
  <text x="248" y="369" fill="#6b7280" font-family="Inter, Roboto, sans-serif" font-size="9" text-anchor="middle">Espera a que el modelo termine · devuelve todo el texto a la vez · mejor para pipelines batch</text>

  <!-- Streaming response -->
  <rect x="480" y="334" width="440" height="44" rx="6" fill="#252540" stroke="#34d399" stroke-width="1"/>
  <text x="700" y="352" fill="#34d399" font-family="Inter, Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">stream: true — Streaming SSE</text>
  <text x="700" y="369" fill="#6b7280" font-family="Inter, Roboto, sans-serif" font-size="9" text-anchor="middle">Primer token llega en ms · UX responsiva · ideal para chatbots</text>
</svg>
