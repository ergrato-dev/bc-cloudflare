<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440">
  <defs>
    <marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#F38020"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#60a5fa"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="440" fill="#1a1a2e"/>

  <!-- Title -->
  <text x="480" y="34" fill="#ffffff" font-family="Inter, Roboto, sans-serif" font-size="17" font-weight="600" text-anchor="middle">Embeddings — Representaciones Vectoriales y Similitud Semántica</text>

  <!-- ── Input texts (left column) ── -->
  <!-- Text A -->
  <rect x="22" y="80" width="195" height="52" rx="8" fill="#252540" stroke="#F38020" stroke-width="2"/>
  <text x="119" y="101" fill="#F38020" font-family="Inter, Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Texto A</text>
  <text x="119" y="118" fill="#e5e7eb" font-family="Inter, Roboto, sans-serif" font-size="11" font-weight="500" text-anchor="middle">"El perro corre en el parque"</text>

  <!-- Text B -->
  <rect x="22" y="178" width="195" height="52" rx="8" fill="#252540" stroke="#F38020" stroke-width="2"/>
  <text x="119" y="199" fill="#F38020" font-family="Inter, Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Texto B</text>
  <text x="119" y="216" fill="#e5e7eb" font-family="Inter, Roboto, sans-serif" font-size="11" font-weight="500" text-anchor="middle">"El can trota por el jardín"</text>

  <!-- Text C -->
  <rect x="22" y="276" width="195" height="52" rx="8" fill="#252540" stroke="#6b7280" stroke-width="1.5"/>
  <text x="119" y="297" fill="#9ca3af" font-family="Inter, Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Texto C</text>
  <text x="119" y="314" fill="#e5e7eb" font-family="Inter, Roboto, sans-serif" font-size="11" font-weight="500" text-anchor="middle">"La factura vence el viernes"</text>

  <!-- ── Embedding Model (center) ── -->
  <rect x="268" y="138" width="195" height="120" rx="8" fill="#1a1a2e" stroke="#F38020" stroke-width="2"/>
  <text x="365" y="164" fill="#F38020" font-family="Inter, Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Embedding Model</text>
  <text x="365" y="182" fill="#9ca3af" font-family="Inter, Roboto, sans-serif" font-size="10" text-anchor="middle">@cf/baai/bge-base-en-v1.5</text>
  <line x1="278" y1="192" x2="452" y2="192" stroke="#374151" stroke-width="1"/>
  <text x="365" y="210" fill="#d1d5db" font-family="Inter, Roboto, sans-serif" font-size="10" text-anchor="middle">Transforma texto en</text>
  <text x="365" y="226" fill="#fbbf24" font-family="Inter, Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">vector de 768 dimensiones</text>
  <text x="365" y="244" fill="#6b7280" font-family="Inter, Roboto, sans-serif" font-size="9" text-anchor="middle">result.data[0]: number[768]</text>

  <!-- Arrows texts → model -->
  <line x1="217" y1="106" x2="266" y2="176" stroke="#F38020" stroke-width="1.5" marker-end="url(#arrow-orange)"/>
  <line x1="217" y1="204" x2="266" y2="198" stroke="#F38020" stroke-width="1.5" marker-end="url(#arrow-orange)"/>
  <line x1="217" y1="302" x2="266" y2="222" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow-orange)"/>

  <!-- Arrows model → vectors -->
  <line x1="463" y1="168" x2="510" y2="110" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <line x1="463" y1="198" x2="510" y2="208" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <line x1="463" y1="228" x2="510" y2="306" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- ── Vectors (middle-right) ── -->
  <!-- Vector A -->
  <rect x="512" y="80" width="195" height="52" rx="8" fill="#16213e" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="609" y="99" fill="#60a5fa" font-family="Inter, Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Vector A (768 dims)</text>
  <text x="609" y="117" fill="#9ca3af" font-family="Inter, Roboto, sans-serif" font-size="10" text-anchor="middle">[0.12, -0.34, 0.87, 0.05, …]</text>

  <!-- Vector B -->
  <rect x="512" y="178" width="195" height="52" rx="8" fill="#16213e" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="609" y="197" fill="#60a5fa" font-family="Inter, Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Vector B (768 dims)</text>
  <text x="609" y="215" fill="#9ca3af" font-family="Inter, Roboto, sans-serif" font-size="10" text-anchor="middle">[0.13, -0.31, 0.84, 0.06, …]</text>

  <!-- Vector C -->
  <rect x="512" y="276" width="195" height="52" rx="8" fill="#16213e" stroke="#374151" stroke-width="1.5"/>
  <text x="609" y="295" fill="#9ca3af" font-family="Inter, Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Vector C (768 dims)</text>
  <text x="609" y="313" fill="#6b7280" font-family="Inter, Roboto, sans-serif" font-size="10" text-anchor="middle">[-0.45, 0.22, -0.60, 0.11, …]</text>

  <!-- ── Semantic Space (right) ── -->
  <rect x="750" y="68" width="188" height="272" rx="8" fill="#16213e" stroke="#374151" stroke-width="1.5"/>
  <text x="844" y="90" fill="#9ca3af" font-family="Inter, Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Espacio Semántico</text>
  <text x="844" y="106" fill="#6b7280" font-family="Inter, Roboto, sans-serif" font-size="9" text-anchor="middle">(proyección 2D simplificada)</text>

  <!-- Axes -->
  <line x1="775" y1="296" x2="925" y2="296" stroke="#374151" stroke-width="1"/>
  <line x1="775" y1="296" x2="775" y2="118" stroke="#374151" stroke-width="1"/>

  <!-- Point A (orange, top-right area) -->
  <circle cx="868" cy="166" r="9" fill="#F38020" opacity="0.9"/>
  <text x="882" y="163" fill="#F38020" font-family="Inter, Roboto, sans-serif" font-size="10" font-weight="700">A</text>

  <!-- Point B (orange, close to A) -->
  <circle cx="880" cy="182" r="9" fill="#F38020" opacity="0.7"/>
  <text x="894" y="185" fill="#F38020" font-family="Inter, Roboto, sans-serif" font-size="10" font-weight="700">B</text>

  <!-- Similarity arc A-B -->
  <line x1="868" y1="166" x2="880" y2="182" stroke="#34d399" stroke-width="1.5" stroke-dasharray="3 2"/>
  <text x="858" y="182" fill="#34d399" font-family="Inter, Roboto, sans-serif" font-size="8" text-anchor="middle">0.97</text>

  <!-- Point C (blue, far from A and B) -->
  <circle cx="800" cy="258" r="9" fill="#60a5fa" opacity="0.7"/>
  <text x="813" y="261" fill="#60a5fa" font-family="Inter, Roboto, sans-serif" font-size="10" font-weight="700">C</text>

  <!-- Distance line A-C (long, dashed red) -->
  <line x1="868" y1="166" x2="800" y2="258" stroke="#ef4444" stroke-width="1" stroke-dasharray="4 3" opacity="0.7"/>
  <text x="838" y="218" fill="#ef4444" font-family="Inter, Roboto, sans-serif" font-size="8" text-anchor="middle" opacity="0.9">0.08</text>

  <!-- Cosine similarity formula at bottom of space -->
  <text x="844" y="318" fill="#6b7280" font-family="Inter, Roboto, sans-serif" font-size="8" text-anchor="middle">cos(θ) = A·B / (|A| × |B|)</text>
  <text x="844" y="330" fill="#6b7280" font-family="Inter, Roboto, sans-serif" font-size="8" text-anchor="middle">rango: -1 a 1</text>

  <!-- Arrows vectors → space -->
  <line x1="707" y1="106" x2="748" y2="180" stroke="#60a5fa" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow-blue)"/>
  <line x1="707" y1="204" x2="748" y2="190" stroke="#60a5fa" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow-blue)"/>
  <line x1="707" y1="302" x2="748" y2="258" stroke="#374151" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow-blue)"/>

  <!-- ── Legend ── -->
  <rect x="22" y="365" width="916" height="54" rx="8" fill="#16213e" stroke="#374151" stroke-width="1"/>

  <circle cx="48" cy="386" r="6" fill="#F38020"/>
  <text x="60" y="390" fill="#d1d5db" font-family="Inter, Roboto, sans-serif" font-size="10">A y B: frases semánticamente similares → vectores cercanos → similitud ≈ 0.97</text>

  <circle cx="48" cy="408" r="6" fill="#60a5fa"/>
  <text x="60" y="412" fill="#d1d5db" font-family="Inter, Roboto, sans-serif" font-size="10">C: frase sin relación semántica → vector lejano → similitud ≈ 0.08</text>

  <text x="620" y="390" fill="#6b7280" font-family="Inter, Roboto, sans-serif" font-size="10">Uso típico: pre-computar en ingesta → almacenar en Vectorize → comparar en búsqueda</text>
  <text x="620" y="408" fill="#6b7280" font-family="Inter, Roboto, sans-serif" font-size="10">Umbral recomendado: similitud > 0.8 para considerar textos como relacionados</text>
</svg>
