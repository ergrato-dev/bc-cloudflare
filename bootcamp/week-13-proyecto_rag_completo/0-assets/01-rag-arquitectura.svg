<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" width="920" height="560" font-family="Inter, Roboto, system-ui, sans-serif">
  <!-- Background -->
  <rect width="920" height="560" fill="#1a1a2e" rx="12"/>

  <!-- Title -->
  <text x="460" y="36" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">Semana 13 — Arquitectura RAG Completa</text>

  <!-- ===== PIPELINE LABELS ===== -->
  <text x="200" y="64" text-anchor="middle" fill="#F38020" font-size="11" font-weight="600">PIPELINE DE INGESTA</text>
  <text x="680" y="64" text-anchor="middle" fill="#4ade80" font-size="11" font-weight="600">PIPELINE DE CONSULTA</text>

  <!-- Divider vertical -->
  <line x1="460" y1="55" x2="460" y2="530" stroke="#2d2d4e" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- ===== CLIENT (left) ===== -->
  <rect x="20" y="220" width="110" height="52" rx="8" fill="#16213e" stroke="#4f4f7a" stroke-width="1.5"/>
  <text x="75" y="241" text-anchor="middle" fill="#a0a0c0" font-size="10" font-weight="600">CLIENTE</text>
  <text x="75" y="258" text-anchor="middle" fill="#6060a0" font-size="9">POST /documents</text>
  <text x="75" y="270" text-anchor="middle" fill="#6060a0" font-size="9">{ title, content }</text>

  <!-- ===== CLIENT (right) ===== -->
  <rect x="790" y="220" width="110" height="52" rx="8" fill="#16213e" stroke="#4f4f7a" stroke-width="1.5"/>
  <text x="845" y="241" text-anchor="middle" fill="#a0a0c0" font-size="10" font-weight="600">CLIENTE</text>
  <text x="845" y="258" text-anchor="middle" fill="#6060a0" font-size="9">POST /query</text>
  <text x="845" y="270" text-anchor="middle" fill="#6060a0" font-size="9">{ question }</text>

  <!-- ===== WORKER (center) ===== -->
  <rect x="370" y="200" width="180" height="92" rx="10" fill="#F38020" fill-opacity="0.15" stroke="#F38020" stroke-width="2"/>
  <text x="460" y="226" text-anchor="middle" fill="#F38020" font-size="13" font-weight="700">⚡ Worker</text>
  <text x="460" y="244" text-anchor="middle" fill="#e0a060" font-size="9">POST /documents</text>
  <text x="460" y="257" text-anchor="middle" fill="#e0a060" font-size="9">POST /query</text>
  <text x="460" y="270" text-anchor="middle" fill="#e0a060" font-size="9">POST /query/stream</text>
  <text x="460" y="283" text-anchor="middle" fill="#e0a060" font-size="9">GET /documents</text>

  <!-- ===== WORKERS AI (top) ===== -->
  <rect x="360" y="70" width="200" height="68" rx="10" fill="#F38020" fill-opacity="0.18" stroke="#F38020" stroke-width="1.5"/>
  <text x="460" y="94" text-anchor="middle" fill="#F38020" font-size="12" font-weight="700">Workers AI</text>
  <text x="460" y="110" text-anchor="middle" fill="#e0a060" font-size="9">bge-base-en-v1.5 (embed)</text>
  <text x="460" y="124" text-anchor="middle" fill="#e0a060" font-size="9">llama-3.1-8b-instruct (LLM)</text>

  <!-- Worker → Workers AI (embed, both pipelines) -->
  <line x1="460" y1="200" x2="460" y2="138" stroke="#F38020" stroke-width="1.5" stroke-dasharray="5,3"/>
  <polygon points="460,139 456,150 464,150" fill="#F38020"/>
  <text x="478" y="172" fill="#F38020" font-size="8">embed(text)</text>

  <!-- ===== R2 (ingestion path, bottom-left) ===== -->
  <rect x="60" y="380" width="140" height="60" rx="8" fill="#003682" fill-opacity="0.25" stroke="#003682" stroke-width="1.5"/>
  <text x="130" y="403" text-anchor="middle" fill="#6090d0" font-size="11" font-weight="700">R2 Bucket</text>
  <text x="130" y="420" text-anchor="middle" fill="#4070a0" font-size="9">rag-documents</text>
  <text x="130" y="433" text-anchor="middle" fill="#4070a0" font-size="9">objeto: { content }</text>

  <!-- ===== D1 (center-bottom) ===== -->
  <rect x="350" y="380" width="140" height="60" rx="8" fill="#003682" fill-opacity="0.25" stroke="#003682" stroke-width="1.5"/>
  <text x="420" y="403" text-anchor="middle" fill="#6090d0" font-size="11" font-weight="700">D1 Database</text>
  <text x="420" y="420" text-anchor="middle" fill="#4070a0" font-size="9">rag-docs</text>
  <text x="420" y="433" text-anchor="middle" fill="#4070a0" font-size="9">tabla: documents</text>

  <!-- ===== VECTORIZE (right) ===== -->
  <rect x="630" y="380" width="150" height="60" rx="8" fill="#003682" fill-opacity="0.25" stroke="#003682" stroke-width="1.5"/>
  <text x="705" y="403" text-anchor="middle" fill="#6090d0" font-size="11" font-weight="700">Vectorize</text>
  <text x="705" y="420" text-anchor="middle" fill="#4070a0" font-size="9">rag-index</text>
  <text x="705" y="433" text-anchor="middle" fill="#4070a0" font-size="9">768 dims · cosine</text>

  <!-- Worker → R2 -->
  <line x1="400" y1="292" x2="185" y2="382" stroke="#4070c0" stroke-width="1.5"/>
  <polygon points="185,382 192,371 178,373" fill="#4070c0"/>
  <text x="255" y="330" fill="#4070c0" font-size="8">put(docId, content)</text>

  <!-- Worker → D1 -->
  <line x1="430" y1="292" x2="420" y2="380" stroke="#4070c0" stroke-width="1.5"/>
  <polygon points="420,380 416,369 424,369" fill="#4070c0"/>
  <text x="432" y="340" fill="#4070c0" font-size="8">INSERT</text>

  <!-- Worker → Vectorize (upsert) -->
  <line x1="510" y1="292" x2="670" y2="382" stroke="#F38020" stroke-width="1.5"/>
  <polygon points="668,382 665,370 677,374" fill="#F38020"/>
  <text x="580" y="325" fill="#F38020" font-size="8">upsert(vector)</text>

  <!-- Vectorize → D1 (query path: fetch docs) -->
  <line x1="630" y1="410" x2="490" y2="410" stroke="#4ade80" stroke-width="1.5" stroke-dasharray="5,3"/>
  <polygon points="490,410 500,406 500,414" fill="#4ade80"/>
  <text x="540" y="405" fill="#4ade80" font-size="8">ids → SELECT</text>

  <!-- Client left → Worker -->
  <line x1="130" y1="246" x2="370" y2="246" stroke="#4070c0" stroke-width="1.5"/>
  <polygon points="370,246 360,242 360,250" fill="#4070c0"/>

  <!-- Client right → Worker -->
  <line x1="790" y1="246" x2="550" y2="246" stroke="#4ade80" stroke-width="1.5"/>
  <polygon points="550,246 560,242 560,250" fill="#4ade80"/>

  <!-- Worker → Client right (SSE stream) -->
  <line x1="550" y1="265" x2="790" y2="265" stroke="#4ade80" stroke-width="1.5" stroke-dasharray="5,3"/>
  <polygon points="790,265 780,261 780,269" fill="#4ade80"/>
  <text x="640" y="280" fill="#4ade80" font-size="8">SSE stream</text>

  <!-- SSE badge -->
  <rect x="750" y="290" width="90" height="22" rx="6" fill="#4ade80" fill-opacity="0.15" stroke="#4ade80" stroke-width="1"/>
  <text x="795" y="305" text-anchor="middle" fill="#4ade80" font-size="9" font-weight="600">text/event-stream</text>

  <!-- ===== LEGEND ===== -->
  <rect x="20" y="480" width="880" height="58" rx="8" fill="#16213e" stroke="#2d2d4e" stroke-width="1"/>
  <text x="40" y="500" fill="#a0a0c0" font-size="10" font-weight="600">Leyenda:</text>
  <line x1="100" y1="496" x2="130" y2="496" stroke="#4070c0" stroke-width="2"/>
  <text x="135" y="500" fill="#6090c0" font-size="9">Ingesta (write)</text>
  <line x1="220" y1="496" x2="250" y2="496" stroke="#F38020" stroke-width="2"/>
  <text x="255" y="500" fill="#e0a060" font-size="9">Embed (Workers AI)</text>
  <line x1="360" y1="496" x2="390" y2="496" stroke="#4ade80" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="395" y="500" fill="#4ade80" font-size="9">Consulta (read / SSE)</text>
  <text x="40" y="525" fill="#6060a0" font-size="9">Bindings: AI · DB (D1) · BUCKET (R2) · INDEX (Vectorize)</text>
  <text x="500" y="525" fill="#6060a0" font-size="9">Modelos: bge-base-en-v1.5 (embed 768d) · llama-3.1-8b-instruct (LLM)</text>
</svg>
