<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" width="860" height="480" font-family="Inter, system-ui, sans-serif">
  <!-- Fondo principal -->
  <rect width="860" height="480" fill="#1a1a2e"/>

  <!-- Título -->
  <text x="430" y="38" text-anchor="middle" font-size="16" font-weight="bold" fill="#FFFFFF">Vectorize — Arquitectura y Flujo de Búsqueda Semántica</text>

  <!-- ===== CLIENTE ===== -->
  <rect x="30" y="180" width="130" height="56" rx="8" fill="#16213e" stroke="#2D3748" stroke-width="1.5"/>
  <text x="95" y="203" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">Cliente</text>
  <text x="95" y="221" text-anchor="middle" font-size="10" fill="#A0AEC0">POST /index</text>
  <text x="95" y="235" text-anchor="middle" font-size="10" fill="#A0AEC0">POST /search</text>

  <!-- Flecha cliente → Worker -->
  <line x1="160" y1="208" x2="218" y2="208" stroke="#F38020" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <text x="189" y="200" text-anchor="middle" font-size="9" fill="#F38020">HTTPS</text>

  <!-- ===== WORKER ===== -->
  <rect x="220" y="150" width="170" height="116" rx="8" fill="#F38020" fill-opacity="0.15" stroke="#F38020" stroke-width="2"/>
  <text x="305" y="175" text-anchor="middle" font-size="13" font-weight="bold" fill="#F38020">Cloudflare Worker</text>
  <text x="305" y="195" text-anchor="middle" font-size="10" fill="#FFFFFF">Hono + Zod</text>
  <rect x="235" y="205" width="140" height="22" rx="4" fill="#16213e" stroke="#2D3748" stroke-width="1"/>
  <text x="305" y="220" text-anchor="middle" font-size="9" fill="#A0AEC0">POST /index  →  upsert()</text>
  <rect x="235" y="232" width="140" height="22" rx="4" fill="#16213e" stroke="#2D3748" stroke-width="1"/>
  <text x="305" y="247" text-anchor="middle" font-size="9" fill="#A0AEC0">POST /search  →  query()</text>

  <!-- Flecha Worker → Workers AI (indexación) -->
  <line x1="390" y1="185" x2="458" y2="155" stroke="#F38020" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-orange)"/>
  <text x="440" y="168" text-anchor="middle" font-size="9" fill="#A0AEC0">AI.run()</text>
  <text x="440" y="180" text-anchor="middle" font-size="9" fill="#A0AEC0">bge-base</text>

  <!-- ===== WORKERS AI ===== -->
  <rect x="460" y="80" width="150" height="72" rx="8" fill="#F38020" fill-opacity="0.15" stroke="#F38020" stroke-width="1.5"/>
  <text x="535" y="104" text-anchor="middle" font-size="12" font-weight="bold" fill="#F38020">Workers AI</text>
  <text x="535" y="122" text-anchor="middle" font-size="10" fill="#FFFFFF">@cf/baai/bge-base-en-v1.5</text>
  <text x="535" y="140" text-anchor="middle" font-size="10" fill="#A0AEC0">→ vector 768d</text>

  <!-- Flecha Workers AI → Worker (embedding devuelto) -->
  <line x1="458" y1="152" x2="390" y2="195" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-white)"/>
  <text x="418" y="210" text-anchor="middle" font-size="9" fill="#A0AEC0">number[768]</text>

  <!-- Flecha Worker → Vectorize (upsert) -->
  <line x1="390" y1="225" x2="458" y2="280" stroke="#F38020" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <text x="440" y="267" text-anchor="middle" font-size="9" fill="#F38020">upsert()</text>

  <!-- Flecha Worker → Vectorize (query) -->
  <line x1="390" y1="248" x2="458" y2="310" stroke="#FFFFFF" stroke-width="1.5" marker-end="url(#arrow-white)"/>
  <text x="440" y="306" text-anchor="middle" font-size="9" fill="#A0AEC0">query()</text>

  <!-- ===== VECTORIZE INDEX ===== -->
  <rect x="460" y="270" width="180" height="110" rx="8" fill="#003682" fill-opacity="0.3" stroke="#003682" stroke-width="2"/>
  <text x="550" y="295" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">Vectorize Index</text>
  <text x="550" y="312" text-anchor="middle" font-size="10" fill="#A0AEC0">metric: cosine · dims: 768</text>

  <!-- Vectores en el índice -->
  <rect x="475" y="322" width="150" height="18" rx="3" fill="#16213e" stroke="#2D3748" stroke-width="1"/>
  <text x="550" y="335" text-anchor="middle" font-size="9" fill="#A0AEC0">id: "doc-001" · score: 0.94</text>
  <rect x="475" y="344" width="150" height="18" rx="3" fill="#16213e" stroke="#2D3748" stroke-width="1"/>
  <text x="550" y="357" text-anchor="middle" font-size="9" fill="#A0AEC0">id: "doc-007" · score: 0.87</text>
  <rect x="475" y="366" width="150" height="18" rx="3" fill="#16213e" stroke="#2D3748" stroke-width="1"/>
  <text x="550" y="379" text-anchor="middle" font-size="9" fill="#A0AEC0">id: "doc-023" · score: 0.81</text>

  <!-- Flecha Vectorize → Worker (matches) -->
  <line x1="458" y1="315" x2="390" y2="258" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-white)"/>
  <text x="418" y="302" text-anchor="middle" font-size="9" fill="#A0AEC0">matches[]</text>

  <!-- ===== LEYENDA FLUJOS ===== -->
  <rect x="30" y="390" width="380" height="72" rx="6" fill="#16213e" stroke="#2D3748" stroke-width="1"/>
  <text x="220" y="410" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF">Flujos</text>
  <!-- Indexación -->
  <line x1="50" y1="428" x2="90" y2="428" stroke="#F38020" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="100" y="432" font-size="10" fill="#A0AEC0">Indexación: texto → bge-base → upsert()</text>
  <!-- Búsqueda -->
  <line x1="50" y1="448" x2="90" y2="448" stroke="#FFFFFF" stroke-width="1.5"/>
  <text x="100" y="452" font-size="10" fill="#A0AEC0">Búsqueda: query → bge-base → query() → matches</text>

  <!-- ===== LEYENDA COMPONENTES ===== -->
  <rect x="430" y="390" width="400" height="72" rx="6" fill="#16213e" stroke="#2D3748" stroke-width="1"/>
  <text x="630" y="410" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF">Componentes</text>
  <rect x="450" y="420" width="14" height="14" rx="3" fill="#F38020" fill-opacity="0.5" stroke="#F38020"/>
  <text x="472" y="431" font-size="10" fill="#A0AEC0">Worker / compute</text>
  <rect x="580" y="420" width="14" height="14" rx="3" fill="#003682" fill-opacity="0.5" stroke="#003682"/>
  <text x="602" y="431" font-size="10" fill="#A0AEC0">Vectorize (storage)</text>
  <rect x="450" y="444" width="14" height="14" rx="3" fill="#16213e" stroke="#2D3748"/>
  <text x="472" y="455" font-size="10" fill="#A0AEC0">Cliente / request</text>

  <!-- Definiciones de flechas -->
  <defs>
    <marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#F38020"/>
    </marker>
    <marker id="arrow-white" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#FFFFFF"/>
    </marker>
  </defs>
</svg>
